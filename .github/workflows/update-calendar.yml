name: Update ESF Calendar

on:
  schedule:
    # Täglich um 04:00 Uhr UTC.
    # Das entspricht je nach Sommer- oder Winterzeit
    # 05:00 oder 06:00 Uhr in Deutschland.
    - cron: "0 4 * * *"

  # Ermöglicht einen manuellen Testlauf.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Create and publish ICS calendar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Check Python syntax
        run: python -m py_compile create_ics.py

      - name: Create ICS calendar
        run: python create_ics.py

      - name: Validate generated file
        shell: bash
        run: |
          test -f esf-bolle-kalender.ics
          grep -q "^BEGIN:VCALENDAR" esf-bolle-kalender.ics
          grep -q "^BEGIN:VEVENT" esf-bolle-kalender.ics
          grep -q "^END:VCALENDAR" esf-bolle-kalender.ics
          echo "ICS file passed basic validation."

      - name: Commit updated calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add esf-bolle-kalender.ics

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Update ESF calendar"
            git push
          fi
