name: Update ESF Calendar

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-calendar:
    name: Build and publish ESF ICS calendar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests tzdata

      - name: Check Python syntax
        run: python -m py_compile create_ics.py

      - name: Create ICS calendar
        run: python create_ics.py

      - name: Validate generated file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('esf-bolle-kalender.ics').read_text(encoding='utf-8')
          assert content.startswith('BEGIN:VCALENDAR')
          assert content.rstrip('\r\n').endswith('END:VCALENDAR')
          assert 'BEGIN:VEVENT' in content
          assert content.count('BEGIN:VEVENT') == content.count('END:VEVENT')
          assert content.count('BEGIN:VEVENT') >= 1
          print('ICS validation passed.')
          PY

      - name: Commit updated calendar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esf-bolle-kalender.ics

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Update ESF calendar"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-pages:
    name: Deploy calendar to GitHub Pages
    needs: update-calendar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
